[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docquery"]

[project]
name = "docquery"
version = "0.1.0"
description = "PDF → embeddings → LangGraph structured extraction and RAG chat pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langgraph>=0.4.0",
    "pymupdf>=1.27.2.3",
    "pytesseract>=0.3.13",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.0.0",
    "pdfplumber>=0.11.0",
]

[project.scripts]
docquery = "docquery.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docquery"]

[project]
name = "docquery"
version = "0.1.0"
description = "PDF → embeddings → LangGraph structured extraction and RAG chat pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langgraph>=0.4.0",
    "pymupdf>=1.27.2.3",
    "pytesseract>=0.3.13",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.0.0",
    "unstructured[pdf] (>=0.22.29,<0.23.0)",
    "pi-heif>=1.3.0",
    "unstructured-inference>=1.6.11",
    "pdfminer>=20191125",
    "pdfminer-six>=20221105",
    "pdf2image>=1.17.0",
    "langchain-unstructured>=1.0.0,<2.0.0",
    "unstructured-client (>=0.44.0,<0.45.0)",
    "python-magic (>=0.4.27,<0.5.0)",
    "chromadb>=1.5.9",
    "langchain-chroma>=1.1.0",
]

[project.scripts]
docquery = "docquery.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

